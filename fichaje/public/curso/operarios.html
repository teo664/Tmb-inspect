// ── Estado ──
const STORE_KEY = 'tmb_curso_operarios';
const store = {
  get() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } },
  set(value) { try { localStorage.setItem(STORE_KEY, JSON.stringify(value)); } catch { /* sin almacenamiento */ } },
};
const saved = store.get();
const hashLang = location.hash.replace('#', '');
const state = {
  lang: COURSE[hashLang] ? hashLang : (COURSE[saved.lang] ? saved.lang : (COURSE[(navigator.language || '').slice(0, 2)] ? navigator.language.slice(0, 2) : 'en')),
  index: Number.isInteger(saved.index) ? saved.index : 0,
  done: new Set(saved.done || []),
  answered: {},
  finished: false,
};
const persist = () => store.set({ lang: state.lang, index: state.index, done: [...state.done] });

const clockText = (ms) => {
  const s = Math.floor(ms / 1000);
  return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map((n) => String(n).padStart(2, '0')).join(':');
};
const nowTime = (offsetMin = 0) => new Date(Date.now() + offsetMin * 60000).toLocaleTimeString(state.lang, { hour: '2-digit', minute: '2-digit' });

const newSim = (kind) => {
  const base = { kind, appLang: state.lang, ot: null, place: null, dialog: null, coach: null };
  if (kind === 'login') return { ...base, screen: 'login', tried: [] };
  if (kind === 'clock') return { ...base, screen: 'idle' };
  if (kind === 'clockOut') return { ...base, screen: 'working', ot: ORDERS[0], place: 'board', start: Date.now() - (3 * 3600 + 25 * 60) * 1000 };
  if (kind === 'large') return { ...base, screen: 'login', working: false };
  if (kind === 'records') return { ...base, screen: 'records' };
  return base;
};

    <div class="a-muted">${esc(a.since)} ${new Date(s.start).toLocaleTimeString(state.lang, { hour: '2-digit', minute: '2-digit' })}</div>
    <div class="a-timer" id="sim-timer">${clockText(Date.now() - s.start)}</div>
    <button type="button" class="a-btn outb pulse" data-act="out">⏹ ${esc(a.out)}</button>
  </div>`;

const mobileScreen = (s, a) => {
  if (s.screen === 'working') return `${appBar(a)}<div class="app-body">${workingCard(s, a)}</div>`;
  if (s.screen === 'finished') {
    return `${appBar(a)}<div class="app-body"><div class="a-card center"><div class="a-big">${esc(a.hello)}, Ivan</div><div class="a-muted">${esc(a.notWorking)}</div></div>
      <div class="a-card"><div class="a-h">${esc(a.mine)}</div><div class="a-entry"><span>${s.ot.number} · ${s.place === 'workshop' ? esc(a.workshop) : esc(a.board)}</span><span class="a-badge a">${esc(a.pending)}</span></div></div></div>`;
  }
  return `${appBar(a)}<div class="app-body"><div class="a-card">
      <div class="a-big" style="text-align:center">${esc(a.hello)}, Ivan</div>
      <div class="a-muted" style="text-align:center">${esc(a.notWorking)}</div>
      <div class="a-h">${esc(a.selectOt)}</div>${otList(s)}
      <div class="a-h">${esc(a.place)}</div>${placeButtons(s, a)}
      <input class="a-input" placeholder="${esc(a.note)}" aria-label="${esc(a.note)}">
      <button type="button" class="a-btn in${s.ot && s.place ? ' pulse' : ''}" data-act="in" ${s.ot && s.place ? '' : 'disabled'}>▶ ${esc(a.in)}</button>
    </div></div>`;
};

const dialogHtml = (s, a) => {
  if (!s.dialog) return '';
  const text = s.dialog === 'in' ? `${a.confirmIn.replace('{ot}', s.ot.number)}<br>${s.place === 'workshop' ? a.workshop : a.board}` : a.confirmOut;
  return `<div class="a-dialog"><div class="box"><div>${text}</div>
    <div class="a-row"><button type="button" class="a-btn" data-act="cancel">${esc(a.cancel)}</button><button type="button" class="a-btn primary pulse" data-act="ok">OK</button></div></div></div>`;
};

const largeScreen = (s, a) => {
  if (s.screen === 'login') return loginScreen(s, a);
  if (s.screen === 'done') {
    return `${appBar(a)}<div class="a-done ${s.doneOut ? 'out' : ''}"><div><div class="a-check">✓</div>
      <div class="a-big">${esc(s.doneOut ? a.doneOut : a.doneIn)}</div><div class="a-timer">${s.doneAt}</div>
      <div><strong>Ivan Petrov</strong></div><div class="a-muted">${s.ot.number} · ${esc(s.ot.desc)}</div>
      <div class="a-muted" style="margin-top:8px">${esc(a.auto)}</div></div></div>`;
  }
  if (s.working) {
    return `${appBar(a)}<div class="app-body"><div class="a-card center working">
      <div class="a-muted">${esc(a.workingOn)}</div><div class="a-big">${s.ot.number}</div><div>${esc(s.ot.desc)}</div>
      <div class="a-timer" id="sim-timer">${clockText(Date.now() - s.start)}</div>
      <button type="button" class="a-btn outb pulse" data-act="largeOut">⏹ ${esc(a.out)}</button></div></div>`;
  }
  return `${appBar(a)}<div class="app-body"><div class="a-card">
      <div class="a-h">${esc(a.selectOt)}</div>${otList(s)}
      <div class="a-h">${esc(a.place)}</div>${placeButtons(s, a)}
      <button type="button" class="a-btn in${s.ot && s.place ? ' pulse' : ''}" data-act="largeIn" ${s.ot && s.place ? '' : 'disabled'}>▶ ${esc(a.in)}</button>
    </div></div>`;
};

const recordsScreen = (a) => {
  const rows = [
    [a.today, '2362', a.board, '07:30 – …', a.progress, 'g', 'recProgress'],
    ['14/10', '2362', a.board, '07:30 – 16:00', a.pending, 'a', 'recPending'],
    ['13/10', '2370', a.workshop, '07:30 – 15:30', a.pending, 'a', 'recPending'],
    ['10/10', '2370', a.workshop, '07:30 – 16:30', '✓ ' + a.verified, 'g', 'recVerified'],
  ];
  return `${appBar(a)}<div class="app-body">
    <div class="a-stats"><div class="a-stat"><b>3.5</b><div class="a-muted">${esc(a.hours)} · ${esc(a.today)}</div></div>
      <div class="a-stat"><b>27.5</b><div class="a-muted">${esc(a.hours)} · ${esc(a.week)}</div></div></div>
    <div class="a-card"><div class="a-h">${esc(a.mine)} <span class="a-muted">· ${esc(a.last)}</span></div>
      <div class="a-list">${rows.map((r) => `<div class="a-entry"><div><strong>${esc(r[0])}</strong> · ${r[1]}<div class="a-muted">${esc(r[2])} · ${r[3]}</div></div>
        <div><button type="button" class="a-badge ${r[5]}" style="border:0;cursor:pointer" data-act="badge" data-v="${r[6]}">${esc(r[4])}</button></div></div>`).join('')}</div>
      <button type="button" class="a-btn" style="font-size:0.9em;padding:8px">${esc(a.pwd)}</button></div>
  </div>`;
};

const coachFor = (s) => {
  const k = C().coach;
  if (s.coach) return s.coach;
  if (s.kind === 'login') return s.screen === 'login' ? (s.tried.includes('mobile') ? k.loginLarge : k.login) : null;
  if (s.kind === 'records') return k.records;
  if (s.kind === 'large') {
    if (s.screen === 'login') return s.working ? k.largeBack : k.largeLogin;
    if (s.screen === 'done') return s.doneOut ? k.largeDoneOut : k.largeDoneIn;
    return s.working ? k.largeOut : k.largeIn;
  }
  if (s.dialog) return s.dialog === 'in' ? k.confirm : k.confirmOut;
  if (s.screen === 'working') return k.working;
  if (s.screen === 'finished') return k.finished;
  if (!s.ot) return k.pickOt;
  if (!s.place) return k.pickPlace;
  return k.tapIn;
};

const renderSim = () => {
  const host = $('#sim');
  if (!host || !sim) return;
  const a = APP[sim.appLang];
  let screen;
  if (sim.kind === 'login') {
    if (sim.screen === 'login') screen = loginScreen(sim, a);
    else if (sim.screen === 'mobile') screen = `${appBar(a)}<div class="app-body"><div class="a-card center"><div class="a-big">${esc(a.hello)}, Ivan</div><div class="a-muted">${esc(a.notWorking)}</div></div></div>`;
    else screen = `${appBar(a)}<div class="app-body"><div class="a-card center"><div class="a-big">Ivan Petrov</div><div class="a-h">${esc(a.selectOt)}</div></div></div>`;
  } else if (sim.kind === 'large') screen = largeScreen(sim, a);
  else if (sim.kind === 'records') screen = recordsScreen(a);
  else screen = mobileScreen(sim, a) + dialogHtml(sim, a);

  const big = sim.kind === 'large';
  const coach = coachFor(sim);
  const ok = (sim.kind === 'login' && sim.screen !== 'login') || sim.screen === 'finished' || (sim.screen === 'done' && sim.doneOut) || sim.coach;
  host.innerHTML = `
    <div class="sim-caption">${esc(C().simLabel)} · ${esc(big ? C().computer : C().phone)}</div>
    ${coach ? `<div class="coach${ok ? ' ok' : ''}" role="status"><span class="dot">${ok ? '✓' : '!'}</span><span>${esc(coach)}</span></div>` : ''}
    <div class="${big ? 'screen-big' : 'phone'}"><div class="screen">${screen}</div></div>
    <button type="button" class="sim-reset" data-act="reset">↺ ${esc(C().reset)}</button>`;
  clearInterval(simTicker);
  if ($('#sim-timer')) {
    simTicker = setInterval(() => { const t = $('#sim-timer'); if (t) t.textContent = clockText(Date.now() - sim.start); }, 1000);
  }
};

const simAction = (act, value) => {
  const s = sim;
  s.coach = null;
  clearSimTimers();
  switch (act) {
    case 'reset': sim = newSim(s.kind); if (s.kind === 'login') sim.tried = s.tried; break;
    case 'lang': s.appLang = value; break;
    case 'mode':
      if (s.kind === 'login') { s.tried.push(value); s.screen = value; s.coach = value === 'mobile' ? C().coach.loginDoneMobile : C().coach.loginDoneLarge; }
      else if (s.kind === 'large') {
        if (value !== 'large') { s.coach = C().coach.largeLogin; break; }
        s.screen = 'worker'; s.ot = s.working ? s.ot : null; s.place = s.working ? s.place : null;
      }
      break;
    case 'ot': s.ot = ORDERS.find((o) => o.id === Number(value)); break;
    case 'place': s.place = value; break;
    case 'in': s.dialog = 'in'; break;
    case 'out': s.dialog = 'out'; break;
    case 'cancel': s.dialog = null; break;
    case 'ok':
      if (s.dialog === 'in') { s.screen = 'working'; s.start = Date.now(); } else { s.screen = 'finished'; }
      s.dialog = null;
      break;
    case 'largeIn':
      s.working = true; s.start = Date.now(); s.screen = 'done'; s.doneOut = false; s.doneAt = nowTime();
      simTimers.push(setTimeout(() => { s.screen = 'login'; renderSim(); }, 4000));
      break;
    case 'largeOut':
      s.working = false; s.screen = 'done'; s.doneOut = true; s.doneAt = nowTime();
      simTimers.push(setTimeout(() => { s.screen = 'login'; s.ot = null; s.place = null; s.finishedOnce = true; renderSim(); }, 4000));
      break;
    case 'badge': s.coach = C().coach[value]; break;
    default: break;
  }
  renderSim();
};

// ── Lecciones ──
const quizHtml = (lesson, li) => `
  <section class="quiz" aria-labelledby="quiz-h">
    <h3 id="quiz-h">${esc(C().check)}</h3>
    ${lesson.quiz.map((q, qi) => {
      const ans = state.answered[`${li}.${qi}`];
      return `<div class="q"><div class="qtext">${esc(q.q)}</div>
        <div class="answers">${q.a.map((text, ai) => {
          const cls = ans?.picked?.includes(ai) ? (ai === q.c ? 'right' : 'wrong') : '';
          return `<button type="button" class="${cls}" data-q="${qi}" data-a="${ai}" ${ans?.correct ? 'disabled' : ''}>${esc(text)}</button>`;
        }).join('')}</div>
        ${ans ? `<div class="feedback ${ans.correct ? 'right' : 'wrong'}" role="status">${ans.correct ? `${esc(C().right)} ${esc(q.why)}` : `${esc(C().wrong)} ${esc(C().tryAgain)}`}</div>` : ''}
      </div>`;
    }).join('')}
  </section>`;

const lessonComplete = (li) => {
  const lesson = C().lessons[li];
  return !lesson.quiz || lesson.quiz.every((_, qi) => state.answered[`${li}.${qi}`]?.correct) || state.done.has(li);
};

const render = () => {
  clearSimTimers();
  const c = C();
  document.documentElement.lang = state.lang;
  document.title = c.title;
  $('#course-title').textContent = c.title;
  $('#course-sub').textContent = c.sub;
  document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
  const total = c.lessons.length;
  $('#progress-fill').style.width = `${(state.done.size / total) * 100}%`;
  $('#progress-label').textContent = `${state.done.size} ${c.of} ${total} ${c.done}`;
  $('#toc').innerHTML = c.lessons.map((l, i) => `
    <button type="button" data-go="${i}" class="${state.done.has(i) ? 'done' : ''}" ${i === state.index && !state.finished ? 'aria-current="step"' : ''}>
      <span class="num">${state.done.has(i) ? '✓' : i + 1}</span><span>${esc(l.name)}</span></button>`).join('');

  if (state.finished) {
    $('#lesson').innerHTML = `<section class="finish"><div class="medal">✓</div><h2>${esc(c.finishTitle)}</h2><p class="prose" style="margin:0 auto">${esc(c.finishText)}</p>
      <button type="button" class="btn" data-go="0">${esc(c.finishAgain)}</button></section>`;
    return;
  }

  const li = state.index;
  const lesson = c.lessons[li];
  const isLast = li === total - 1;
  const content = `
    <div class="prose">${lesson.body || ''}</div>
    ${lesson.tip ? `<div class="tip"><span class="tag">${esc(c.tip)}</span><span>${esc(lesson.tip)}</span></div>` : ''}
    ${lesson.warn ? `<div class="tip warn"><span class="tag">${esc(c.careful)}</span><span>${esc(lesson.warn)}</span></div>` : ''}
    ${lesson.table ? `<div class="table-wrap"><table class="info"><thead><tr>${lesson.table.head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${lesson.table.rows.map((r) => `<tr><td><strong>${esc(r[0])}</strong></td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
  $('#lesson').innerHTML = `
    <div><div class="eyebrow">${esc(c.lesson)} ${li + 1} ${esc(c.of)} ${total}</div><h2>${esc(lesson.name)}</h2></div>
    ${lesson.sim ? `<div class="split"><div style="display:flex;flex-direction:column;gap:16px">${content}</div><div class="sim-wrap" id="sim"></div></div>` : content}
    ${lesson.quiz ? quizHtml(lesson, li) : ''}
    <div class="lesson-nav">
      <button type="button" class="btn" data-nav="-1" ${li === 0 ? 'disabled' : ''}>${esc(c.prev)}</button>
      <button type="button" class="btn primary" data-nav="1" ${lessonComplete(li) ? '' : `disabled title="${esc(c.answerAll)}"`}>${esc(isLast ? c.finish : c.next)}</button>
    </div>`;
  if (lesson.sim) {
    if (!sim || sim.kind !== lesson.sim) sim = newSim(lesson.sim);
    sim.appLang = sim.appLang || state.lang;
    renderSim();
  }
};

const goTo = (index) => {
  state.finished = false;
  state.index = Math.max(0, Math.min(C().lessons.length - 1, index));
  sim = null;
  persist();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

document.addEventListener('click', (event) => {
  const el = event.target.closest('button');
  if (!el) return;
  if (el.dataset.lang) {
    state.lang = el.dataset.lang;
    if (sim) sim.appLang = state.lang;
    persist();
    render();
    return;
  }
  if (el.dataset.go !== undefined) { goTo(Number(el.dataset.go)); return; }
  if (el.dataset.act) { simAction(el.dataset.act, el.dataset.v); return; }
  if (el.dataset.q !== undefined) {
    const li = state.index;
    const qi = Number(el.dataset.q);
    const ai = Number(el.dataset.a);
    const key = `${li}.${qi}`;
    const prev = state.answered[key] || { picked: [] };
    const correct = ai === C().lessons[li].quiz[qi].c;
    state.answered[key] = { picked: [...prev.picked, ai], correct };
    // Se conserva el scroll para no saltar al volver a pintar.
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
    return;
  }
  if (el.dataset.nav) {
    const step = Number(el.dataset.nav);
    if (step > 0) {
      state.done.add(state.index);
      if (state.index === C().lessons.length - 1) { state.finished = true; persist(); render(); window.scrollTo({ top: 0 }); return; }
    }
    goTo(state.index + step);
  }
});

render();
</script>
</body>
</html>
